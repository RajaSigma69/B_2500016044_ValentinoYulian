<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kawaii Pixel Calc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sky" aria-hidden="true"><i class="cloud c1"></i><i class="cloud c2"></i><i class="stars"></i></div>

<main class="calc" aria-label="Kawaii pixel calculator">
  <i class="spark sp1" aria-hidden="true"></i>
  <i class="spark sp2" aria-hidden="true"></i>
  <i class="spark sp3" aria-hidden="true"></i>

  <header class="top">
    <h1 class="title">KAWAII CALC</h1>
  </header>
  <div class="tools">
    <button class="tool" id="sfxBtn" type="button" aria-pressed="true">SFX ON</button>
    <button class="tool" id="bgmBtn" type="button" aria-pressed="false">MUSIC OFF</button>
    <button class="tool" id="theme" type="button">NIGHT</button>
  </div>

  <section class="pal">
    <canvas id="mascot" width="16" height="13" aria-hidden="true"></canvas>
    <div class="bubble"><p class="msg" id="msg"></p></div>
  </section>

  <section class="lcd">
    <div class="expr" id="expr"></div>
    <output class="disp" id="disp">0</output>
  </section>

  <div class="keys" id="keys" role="group" aria-label="Calculator keys">
    <button type="button" class="k clr" data-a="clr" aria-label="Clear">✦CLEAR!✦</button>
    <button type="button" class="k fn"  data-a="del" aria-label="Backspace">DEL</button>
    <button type="button" class="k op"  data-op="/" aria-label="Divide">÷</button>

    <button type="button" class="k num" data-d="7">7</button>
    <button type="button" class="k num" data-d="8">8</button>
    <button type="button" class="k num" data-d="9">9</button>
    <button type="button" class="k op"  data-op="*" aria-label="Multiply">×</button>

    <button type="button" class="k num" data-d="4">4</button>
    <button type="button" class="k num" data-d="5">5</button>
    <button type="button" class="k num" data-d="6">6</button>
    <button type="button" class="k op"  data-op="-" aria-label="Subtract">-</button>

    <button type="button" class="k num" data-d="1">1</button>
    <button type="button" class="k num" data-d="2">2</button>
    <button type="button" class="k num" data-d="3">3</button>
    <button type="button" class="k op"  data-op="+" aria-label="Add">+</button>

    <button type="button" class="k fn"  data-a="sign" aria-label="Plus or minus">±</button>
    <button type="button" class="k num" data-d="0">0</button>
    <button type="button" class="k num" data-a="dot" aria-label="Decimal point">.</button>
    <button type="button" class="k eq"  data-a="eq" aria-label="Equals">=</button>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
